<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队荣誉-高原保护区交通安全管理系统</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./奖杯矢量图/iconfont.css">
    <link rel="stylesheet" href="./css/honor.css">
</head>
<body>
    <main class="honor-page">
        <a class="back-link" href="./index.html">返回首页</a>

        <header class="honor-title">
            <h1>团队荣誉与成果</h1>
            <span></span>
            <p>创新驱动发展 · 科技守护高原</p>
        </header>

        <section class="honor-list">
            <article class="honor-item">
                <div class="honor-copy">
                    <span class="honor-icon iconfont icon-jiangbei"></span>
                    <div>
                        <h2>荣誉奖项</h2>
                        <p>我们在各类学科竞赛中不断突破，曾获第十九届全国节能减排社会实践与科技创新（科技类）三等奖，是对团队科研能力与创新精神的肯定。</p>
                    </div>
                </div>
                <div class="honor-image">
                    <img src="./uploads/占位图.png" alt="荣誉奖项">
                </div>
            </article>

            <article class="honor-item">
                <div class="honor-copy">
                    <span class="honor-icon iconfont icon-jiangbei"></span>
                    <div>
                        <h2>专利成果</h2>
                        <p>团队围绕核心技术开展研究，获得项国家专利授权，形成自主知识产权保护体系。</p>
                    </div>
                </div>
                <div class="honor-image">
                    <img src="./uploads/占位图.png" alt="专利成果">
                </div>
            </article>

            <article class="honor-item">
                <div class="honor-copy">
                    <span class="honor-icon iconfont icon-jiangbei"></span>
                    <div>
                        <h2>产品展示</h2>
                        <p>基于自主研发的道路照明装置，我们保障了高原无人区道路交通安全。</p>
                    </div>
                </div>
                <div class="product-show">
                    <img src="./uploads/模型实物.jpg" alt="获奖作品">
                </div>
            </article>
        </section>
    </main>
</body>
</html>
